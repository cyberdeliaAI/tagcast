[project]
name = "ibroadcast-library-studio"
version = "0.3.0"
description = "A local, album-by-album metadata editor for your iBroadcast library"
requires-python = ">=3.11"
dependencies = ["ibroadcast>=2.0.1,<3"]

[project.scripts]
ibroadcast-editor = "ibroadcast_editor.app:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ibroadcast_editor"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
