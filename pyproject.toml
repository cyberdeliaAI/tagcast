[project]
name = "tagcast"
version = "0.9.0b2"
description = "Tagcast for iBroadcast: an album-by-album metadata editor with online sources, covers and playback"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["ibroadcast>=2.0.1,<3"]

[project.scripts]
tagcast = "tagcast.app:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tagcast"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # long template lines are fine here

[tool.ruff.lint.per-file-ignores]
"tools/build_dark_css.py" = ["E741"]  # l, m, s are the OKLab channel names
