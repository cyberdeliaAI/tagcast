name: Builds

# Electron apps bundle the shared PyInstaller server, for people without Python or uv.
# Older tags retain their original browser launcher recipe. A release gets downloads:
# and a "Publish Tagcast ..." commit once its release job in tests.yml has run. Every push
# that changes more than documentation goes through native checks too. Run by hand to add the
# verified downloads and checksums to an existing release containing this build recipe.
on:
  release:
    types: [published]
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main, codex/album-player-beta]
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to add the downloads to, for example v0.10.1 (empty: only build)"
        required: false
      sign_macos:
        description: "Sign and notarize macOS test artifacts (leave tag empty to avoid publishing)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scope:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_commit.message, 'Publish Tagcast '))
    uses: ./.github/workflows/ci-scope.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag || github.event.workflow_run.head_sha || github.sha }}

  build:
    needs: scope
    name: Build and check · ${{ matrix.target }}
    runs-on: ${{ needs.scope.outputs.full == 'true' && matrix.os || 'ubuntu-latest' }}
    timeout-minutes: ${{ startsWith(matrix.target, 'macos-') && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-2022
            target: windows-x64
          - os: ubuntu-22.04
            target: linux-x64
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || '' }}
      SIGN_MACOS: ${{ startsWith(matrix.target, 'macos-') && (github.event_name == 'release' || github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.sign_macos)) && '1' || '' }}
    steps:
      - name: Select verification for this target
        shell: python
        env:
          CI_FULL: ${{ needs.scope.outputs.full }}
        run: |
          import os
          full = os.environ["CI_FULL"]
          if full not in {"true", "false"}:
              raise SystemExit("CI scope is missing or invalid.")
          print("Full verification required." if full == "true" else
                "Documentation checks passed; application tests/builds are not needed.")
      - uses: actions/checkout@v4
        if: needs.scope.outputs.full == 'true'
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Keep older releases on their one-file recipe
        if: needs.scope.outputs.full == 'true' && (hashFiles('tagcast.spec') == '')
        run: git checkout 805bbeba3cec10a8b41fbb8672d0a8f34d23a87c -- tools/build_binary.py tools/pyinstaller_entry.py
      - uses: actions/setup-python@v5
        if: needs.scope.outputs.full == 'true'
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        if: needs.scope.outputs.full == 'true'
      - uses: actions/setup-node@v4
        if: needs.scope.outputs.full == 'true' && (hashFiles('electron/package.json') != '')
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Check release tag
        if: needs.scope.outputs.full == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          tag = 'v' + re.sub(r'b(\d+)$', r'-beta.\1', version)
          if os.environ['RELEASE_TAG'] and os.environ['RELEASE_TAG'] != tag:
              raise SystemExit(f'Release tag must be {tag}')
          PY
      - name: Install display support (Linux)
        if: needs.scope.outputs.full == 'true' && (runner.os == 'Linux' && hashFiles('tagcast.spec') != '')
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Build and verify extracted Electron downloads (Linux)
        if: needs.scope.outputs.full == 'true' && (runner.os == 'Linux' && hashFiles('electron/package.json') != '')
        run: xvfb-run -a uv run --frozen --python python --with-requirements requirements-build.txt python tools/build_electron.py
      - name: Build and verify extracted Electron downloads
        if: needs.scope.outputs.full == 'true' && (runner.os != 'Linux' && hashFiles('electron/package.json') != '' && (env.SIGN_MACOS != '1' || hashFiles('tools/electron_signed.cjs') == ''))
        run: uv run --frozen --python python --with-requirements requirements-build.txt python tools/build_electron.py
      - name: Build, notarize and verify signed macOS downloads
        if: needs.scope.outputs.full == 'true' && (env.SIGN_MACOS == '1' && hashFiles('tools/electron_signed.cjs') != '')
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: uv run --frozen --python python --with-requirements requirements-build.txt python tools/build_electron.py --sign-macos
      - name: Build and verify older browser-launcher downloads (Linux)
        if: needs.scope.outputs.full == 'true' && (runner.os == 'Linux' && hashFiles('tagcast.spec') != '' && hashFiles('electron/package.json') == '')
        run: xvfb-run -a uv run --frozen --python python --with-requirements requirements-build.txt python tools/build_binary.py --release-tag "$RELEASE_TAG"
      - name: Build and verify older browser-launcher downloads
        if: needs.scope.outputs.full == 'true' && (runner.os != 'Linux' && hashFiles('tagcast.spec') != '' && hashFiles('electron/package.json') == '')
        shell: bash
        run: uv run --frozen --python python --with-requirements requirements-build.txt python tools/build_binary.py --release-tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        if: needs.scope.outputs.full == 'true' && (hashFiles('tagcast.spec') != '')
        with:
          name: tagcast-${{ matrix.target }}
          path: dist/packages/*
          if-no-files-found: error
      - name: Build legacy console download
        if: needs.scope.outputs.full == 'true' && (hashFiles('tagcast.spec') == '')
        run: uv run --frozen --python python --with pyinstaller==6.22.3 python tools/build_binary.py
      - uses: actions/upload-artifact@v4
        if: needs.scope.outputs.full == 'true' && (hashFiles('tagcast.spec') == '')
        with:
          name: tagcast-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.full == 'true'
        with:
          name: smoke-reports-${{ matrix.target }}
          path: build/reports/*.json
          if-no-files-found: ignore

  release:
    name: Add the downloads to the release
    needs: [scope, build, verified]
    if: >-
      needs.scope.outputs.full == 'true' &&
      (github.event_name == 'release' || github.event_name == 'workflow_run' ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tagcast-*
          path: downloads
          merge-multiple: true
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$TAG" ]; then
            # the release job in tests.yml publishes a "Publish Tagcast" commit as its own target
            TAG=$(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.target_commitish == \"$COMMIT\") | .tag_name" | head -n 1)
          fi
          if [ -z "$TAG" ]; then
            echo "No release for this commit, so there is nothing to add the downloads to."
            exit 0
          fi
          gh release upload "$TAG" downloads/* --clobber

  verified:
    name: Distribution verification
    if: ${{ !cancelled() }}
    needs: [scope, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require complete successful validation
        shell: python
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          import json, os
          jobs = json.loads(os.environ["CI_NEEDS"])
          expected = {'build', 'scope'}
          if set(jobs) != expected or any(job.get("result") != "success" for job in jobs.values()):
              raise SystemExit("Required validation failed or did not run.")
          if jobs["scope"].get("outputs", {}).get("full") not in {"true", "false"}:
              raise SystemExit("CI scope is missing or invalid.")
