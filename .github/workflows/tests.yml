name: Tests

on:
  push:
    branches: [main, codex/album-player-beta]
  pull_request:

permissions:
  contents: read

jobs:
  scope:
    uses: ./.github/workflows/ci-scope.yml

  tests:
    needs: scope
    name: Tests · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ needs.scope.outputs.full == 'true' && matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - name: Select verification for this target
        shell: python
        env:
          CI_FULL: ${{ needs.scope.outputs.full }}
        run: |
          import os
          full = os.environ["CI_FULL"]
          if full not in {"true", "false"}:
              raise SystemExit("CI scope is missing or invalid.")
          print("Full verification required." if full == "true" else
                "Documentation checks passed; application tests/builds are not needed.")
      - uses: actions/checkout@v4
        if: needs.scope.outputs.full == 'true'
      - uses: astral-sh/setup-uv@v6
        if: needs.scope.outputs.full == 'true'
        with:
          python-version: ${{ matrix.python }}
      - name: Versions agree
        if: needs.scope.outputs.full == 'true'
        run: uv run --frozen python tools/release_info.py
      - name: Tests
        if: needs.scope.outputs.full == 'true'
        run: uv run --frozen pytest -q
      - name: Lint
        if: needs.scope.outputs.full == 'true'
        run: uv run --frozen ruff check src tests tools
      - name: Page scripts parse
        if: needs.scope.outputs.full == 'true'
        shell: bash
        run: for f in src/tagcast/static/*.js; do node --check "$f"; done
      - name: Frontend regressions
        if: needs.scope.outputs.full == 'true'
        run: node --test tests/*.test.cjs
      - name: Electron shell regressions
        if: needs.scope.outputs.full == 'true' && (hashFiles('electron/package.json') != '')
        shell: bash
        env:
          TAGCAST_PYTHON: ${{ github.workspace }}/.venv/${{ runner.os == 'Windows' && 'Scripts/python.exe' || 'bin/python' }}
        run: node --test electron/tests/*.test.cjs

  start-scripts:
    needs: scope
    name: Start scripts · ${{ matrix.os }}
    runs-on: ${{ needs.scope.outputs.full == 'true' && matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Select verification for this target
        shell: python
        env:
          CI_FULL: ${{ needs.scope.outputs.full }}
        run: |
          import os
          full = os.environ["CI_FULL"]
          if full not in {"true", "false"}:
              raise SystemExit("CI scope is missing or invalid.")
          print("Full verification required." if full == "true" else
                "Documentation checks passed; application tests/builds are not needed.")
      - uses: actions/checkout@v4
        if: needs.scope.outputs.full == 'true'
      - uses: actions/setup-python@v5
        if: needs.scope.outputs.full == 'true'
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        if: needs.scope.outputs.full == 'true'
      # --help makes Tagcast print its usage and stop, so the whole start-up path runs
      # without leaving a server behind.
      - name: With uv
        if: needs.scope.outputs.full == 'true' && (runner.os != 'Windows')
        run: |
          ./start-tagcast.sh --help | tee out.txt && grep -q "usage: tagcast" out.txt
      - name: Without uv, installing into .venv
        if: needs.scope.outputs.full == 'true' && (runner.os != 'Windows')
        env:
          TAGCAST_NO_UV: "1"
        run: |
          rm -rf .venv
          ./start-tagcast.sh --help | tee out.txt && grep -q "usage: tagcast" out.txt
          test -x .venv/bin/tagcast
      - name: Recover unavailable interpreter
        if: needs.scope.outputs.full == 'true' && (runner.os != 'Windows')
        env:
          TAGCAST_NO_UV: "1"
        run: |
          rm .venv/bin/python
          ln -s "$PWD/missing-python" .venv/bin/python
          ./start-tagcast.sh --help | tee out.txt && grep -q "usage: tagcast" out.txt
      - name: With uv (Windows)
        if: needs.scope.outputs.full == 'true' && (runner.os == 'Windows')
        shell: pwsh
        run: |
          $out = "" | cmd /c start-tagcast.bat --help 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch "usage: tagcast") { exit 1 }
      - name: Without uv, installing into .venv (Windows)
        if: needs.scope.outputs.full == 'true' && (runner.os == 'Windows')
        shell: pwsh
        env:
          TAGCAST_NO_UV: "1"
        run: |
          if (Test-Path .venv) { Remove-Item -Recurse -Force .venv }
          $out = "" | cmd /c start-tagcast.bat --help 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch "usage: tagcast") { exit 1 }
          if (-not (Test-Path .venv\Scripts\tagcast.exe)) { exit 1 }
      - name: Recover unavailable interpreter (Windows)
        if: needs.scope.outputs.full == 'true' && (runner.os == 'Windows')
        shell: pwsh
        env:
          TAGCAST_NO_UV: "1"
        run: |
          Remove-Item .venv\Scripts\python.exe
          $out = "" | cmd /c start-tagcast.bat --help 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch "usage: tagcast") { exit 1 }

  release:
    name: Publish the tested Tagcast version
    if: >-
      github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish Tagcast ') &&
      needs.scope.outputs.full == 'true'
    needs: [scope, verified]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Publish the tested commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python tools/release_info.py --publish

  gapless-measured-media:
    needs: scope
    name: Gapless measured PCM · Linux Electron
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Select verification for this target
        shell: python
        env:
          CI_FULL: ${{ needs.scope.outputs.full }}
        run: |
          import os
          full = os.environ["CI_FULL"]
          if full not in {"true", "false"}:
              raise SystemExit("CI scope is missing or invalid.")
          print("Full verification required." if full == "true" else
                "Documentation checks passed; application tests/builds are not needed.")
      - uses: actions/checkout@v4
        if: needs.scope.outputs.full == 'true'
      - uses: actions/setup-node@v4
        if: needs.scope.outputs.full == 'true'
        with:
          node-version: "22"
      - name: Install test-only media tools and virtual output
        if: needs.scope.outputs.full == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=gapless_test
          pactl set-default-sink gapless_test
      - name: Install pinned Electron test runtime
        if: needs.scope.outputs.full == 'true'
        run: |
          npm ci --prefix electron
          node electron/node_modules/electron/install.js
      - name: Configure the Chromium sandbox for the disposable Linux runner
        if: needs.scope.outputs.full == 'true'
        # Ubuntu's user-namespace restrictions require the bundled SUID helper.
        # Keep renderer sandboxing enabled; do not use --no-sandbox.
        run: |
          sudo chown root:root electron/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 electron/node_modules/electron/dist/chrome-sandbox
      - name: Independently encode and round-trip sample-counter fixtures
        if: needs.scope.outputs.full == 'true'
        run: node tools/gapless_lab/fixtures.cjs build/gapless-fixtures --stress
      - name: Measure the unmodified engine and single-file controls
        if: needs.scope.outputs.full == 'true'
        run: xvfb-run -a electron/node_modules/.bin/electron tools/gapless_lab/electron.cjs --fixtures build/gapless-fixtures --out build/gapless-results --suite smoke --stress
      - name: Verify ordinary fallback and transport in the full application
        if: needs.scope.outputs.full == 'true'
        run: xvfb-run -a electron/node_modules/.bin/electron tools/gapless_lab/application.cjs --fixtures build/gapless-fixtures --out build/gapless-application --stress
      # Mixed-block rejection is checked end-to-end in the full application.
      # Required PCM/lifecycle diagnostics fail CI on a regression.
      - name: Record mixed-block, starvation, startup and seek probes
        if: needs.scope.outputs.full == 'true'
        run: xvfb-run -a electron/node_modules/.bin/electron tools/gapless_lab/electron.cjs --fixtures build/gapless-fixtures --out build/gapless-diagnostics --suite diagnostics --stress
      - name: Require complete measurement artifacts
        if: needs.scope.outputs.full == 'true'
        run: node tools/gapless_lab/verify.cjs build/gapless-results build/gapless-diagnostics build/gapless-application
      - name: Prove failing media subprocesses return nonzero
        if: needs.scope.outputs.full == 'true'
        run: xvfb-run -a node tools/gapless_lab/negative.cjs --fixtures build/gapless-fixtures --out build/gapless-negative
      - name: Preserve measurement evidence
        if: always() && needs.scope.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gapless-media-evidence
          if-no-files-found: error
          path: |
            build/gapless-fixtures/manifest.json
            build/gapless-results/*.json
            build/gapless-diagnostics/*.json
            build/gapless-application/*.json
            build/gapless-negative/**/*.json
            build/gapless-negative/*.log

  verified:
    name: Application verification
    if: ${{ !cancelled() }}
    needs: [scope, tests, start-scripts, gapless-measured-media]
    runs-on: ubuntu-latest
    steps:
      - name: Require complete successful validation
        shell: python
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          import json, os
          jobs = json.loads(os.environ["CI_NEEDS"])
          expected = {'gapless-measured-media', 'tests', 'start-scripts', 'scope'}
          if set(jobs) != expected or any(job.get("result") != "success" for job in jobs.values()):
              raise SystemExit("Required validation failed or did not run.")
          if jobs["scope"].get("outputs", {}).get("full") not in {"true", "false"}:
              raise SystemExit("CI scope is missing or invalid.")
