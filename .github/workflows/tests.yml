name: Tests

on:
  push:
    branches: [main, codex/album-player-beta]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Versions agree
        run: uv run --frozen python tools/release_info.py
      - name: Tests
        run: uv run --frozen pytest -q
      - name: Lint
        run: uv run --frozen ruff check src tests tools
      - name: Page scripts parse
        shell: bash
        run: for f in src/tagcast/static/*.js; do node --check "$f"; done
      - name: Frontend regressions
        run: node --test tests/frontend.test.cjs tests/mini-player-view.test.cjs tests/gapless-media.test.cjs tests/gapless-oracle.test.cjs tests/gapless-diagnostics.test.cjs
      - name: Electron shell regressions
        if: hashFiles('electron/package.json') != ''
        shell: bash
        env:
          TAGCAST_PYTHON: ${{ github.workspace }}/.venv/${{ runner.os == 'Windows' && 'Scripts/python.exe' || 'bin/python' }}
        run: node --test electron/tests/*.test.cjs

  start-scripts:
    name: Start scripts · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      # --help makes Tagcast print its usage and stop, so the whole start-up path runs
      # without leaving a server behind.
      - name: With uv
        if: runner.os != 'Windows'
        run: |
          ./start-tagcast.sh --help | tee out.txt && grep -q "usage: tagcast" out.txt
      - name: Without uv, installing into .venv
        if: runner.os != 'Windows'
        env:
          TAGCAST_NO_UV: "1"
        run: |
          rm -rf .venv
          ./start-tagcast.sh --help | tee out.txt && grep -q "usage: tagcast" out.txt
          test -x .venv/bin/tagcast
      - name: Recover unavailable interpreter
        if: runner.os != 'Windows'
        env:
          TAGCAST_NO_UV: "1"
        run: |
          rm .venv/bin/python
          ln -s "$PWD/missing-python" .venv/bin/python
          ./start-tagcast.sh --help | tee out.txt && grep -q "usage: tagcast" out.txt
      - name: With uv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "" | cmd /c start-tagcast.bat --help 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch "usage: tagcast") { exit 1 }
      - name: Without uv, installing into .venv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAGCAST_NO_UV: "1"
        run: |
          if (Test-Path .venv) { Remove-Item -Recurse -Force .venv }
          $out = "" | cmd /c start-tagcast.bat --help 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch "usage: tagcast") { exit 1 }
          if (-not (Test-Path .venv\Scripts\tagcast.exe)) { exit 1 }
      - name: Recover unavailable interpreter (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAGCAST_NO_UV: "1"
        run: |
          Remove-Item .venv\Scripts\python.exe
          $out = "" | cmd /c start-tagcast.bat --help 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch "usage: tagcast") { exit 1 }

  release:
    name: Publish the tested Tagcast version
    if: >-
      github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish Tagcast ')
    needs: [tests, start-scripts, gapless-measured-media]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Publish the tested commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python tools/release_info.py --publish

  gapless-measured-media:
    name: Gapless measured PCM · Linux Electron
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test-only media tools and virtual output
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=gapless_test
          pactl set-default-sink gapless_test
      - name: Install pinned Electron test runtime
        run: |
          npm ci --prefix electron
          node electron/node_modules/electron/install.js
      - name: Configure the Chromium sandbox for the disposable Linux runner
        # Ubuntu's user-namespace restrictions require the bundled SUID helper.
        # Keep renderer sandboxing enabled; do not use --no-sandbox.
        run: |
          sudo chown root:root electron/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 electron/node_modules/electron/dist/chrome-sandbox
      - name: Independently encode and round-trip sample-counter fixtures
        run: node tools/gapless_lab/fixtures.cjs build/gapless-fixtures --stress
      - name: Measure the unmodified engine and single-file controls
        run: xvfb-run -a electron/node_modules/.bin/electron tools/gapless_lab/electron.cjs --fixtures build/gapless-fixtures --out build/gapless-results --suite smoke
      - name: Verify ordinary fallback and transport in the full application
        run: xvfb-run -a electron/node_modules/.bin/electron tools/gapless_lab/application.cjs --fixtures build/gapless-fixtures --out build/gapless-application
      # Mixed-block rejection is checked end-to-end in the full application.
      # Required PCM/lifecycle diagnostics fail CI on a regression.
      - name: Record mixed-block, starvation, startup and seek probes
        run: xvfb-run -a electron/node_modules/.bin/electron tools/gapless_lab/electron.cjs --fixtures build/gapless-fixtures --out build/gapless-diagnostics --suite diagnostics
      - name: Preserve measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gapless-media-evidence
          path: |
            build/gapless-fixtures/manifest.json
            build/gapless-results/*.json
            build/gapless-diagnostics/*.json
            build/gapless-application/*.json
